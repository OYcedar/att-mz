# ATT 每次运行都读取 att.exe 同目录的 config.toml。
# 请填写实际的 API 地址、密钥和模型。服务有限制时再调整并发、超时等值。
# 未知字段、重复字段或错误类型会导致命令失败。所有 *_ms 值均为毫秒。

# WriteBack 可以修正自动译文中与原文一一对应的标点，并为未闭合成对符号内的续行补一个全角空格。
# 两项都只处理正文形式，不改变翻译状态。
[write_back]
repair_punctuation = true
complete_continuation_whitespace = true

# Prompt 可以要求模型返回可读判断和逐项原文。两个开关互不依赖。
[prompts]
thinking_output = true
source_echo = false

# primary 是模型服务 ID。协议决定请求格式，地址可以是基础地址或完整端点；stream 必填，
# true 使用流式响应，false 等待完整 JSON。API key 按字面读取，不解析环境变量。
[llm.clients.primary]
protocol = "chat_completions"
url = "https://api.example.com/v1"
api_key = "replace-with-api-key"
model = "replace-with-model-id"
stream = false

# 这一组控制单个 Client 的活动 HTTP 请求数及超时。所有 *_ms 值均为毫秒；本地排队时间
# 不计入 request_timeout_ms。
max_concurrent_requests = 16
connect_timeout_ms = 5000
read_timeout_ms = 120000
request_timeout_ms = 120000

# proxy 填 false 或不含账号密码的 URL。额外 PEM 的相对路径从 att.exe 所在目录计算。
proxy = false
additional_pem_files = []

# retry_delays_ms 的元素个数就是最多重试次数；max_retry_after_ms 限制接受服务端
# Retry-After 的最长时间。空数组表示不重试。
retry_delays_ms = []
max_retry_after_ms = 1000

# parameters 必须是 JSON object，只填写供应商明确要求的扩展；不能覆盖 model、stream、
# messages/input 或 Responses 的 background。
parameters = '''
{}
'''

# 服务明确限制每分钟请求数时，取消整个区块的注释；burst 是可以立即发出的请求数。
# [llm.clients.primary.rate_limit]
# requests_per_minute = 60
# burst = 8

# 日语规则用 id 参与 Init；minimum_kana_characters 决定残留阈值，allowed_terms 是译文中
# 已确认可以保留的日语。
[[languages]]
type = "japanese"
id = "ja"
minimum_kana_characters = 1
allowed_terms = []

# 英语规则分别控制译前准入和译后残留。ignored_terms 只影响原文判断；allowed_terms 只表示
# 译文中可以保留的英文。
[[languages]]
type = "english"
id = "en"
minimum_word_count = 1
minimum_letter_count = 2
ignored_terms = []
minimum_copied_word_count = 2
minimum_copied_letter_count = 4
allowed_terms = []

# 任务记录保存实际模型任务的 Markdown；省略 record_translation_tasks 时默认为 true。
[translation]
record_translation_tasks = true

# primary 是 Translate 选择的方案 ID，引用上面的模型服务。字符目标用于 TaskBlock 装箱，
# 完整分组不会拆开，因此它不是最终 user message 的硬上限。
[[translation.profiles]]
id = "primary"
llm_client = "primary"
target_task_user_message_characters = 24000
