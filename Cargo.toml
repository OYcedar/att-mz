[package]
name = "att"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
aho-corasick = "1.1.4"
async-channel = "2.5.0"
clap = { version = "4.6.1", features = ["derive"] }
crc32fast = "1.5.0"
futures-util = "0.3.31"
governor = "0.10.4"
httpdate = "1.0.3"
mlua = { version = "0.12.0", default-features = false, features = ["lua54", "vendored"] }
native-tls = "0.2.18"
pcre2 = "0.2.11"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10.9"
time = { version = "0.3.53", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time", "sync", "net", "signal", "macros"] }
toml = "1.1.3"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_Globalization", "Win32_Security_Cryptography"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
