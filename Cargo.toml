[package]
name = "att"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
aho-corasick = "1.1.4"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.31"
pcre2 = "0.2.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
