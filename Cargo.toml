[package]
name = "att"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
