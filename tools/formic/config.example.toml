# ATT 随包 Formic 的高并发默认。填写 config.toml，或使用 FORMIC_LLM_* 环境变量覆盖。
url = "https://api.example.com/v1"
api_key = "replace-with-api-key"
model = "model-name"
context_window_tokens = 200000
max_output_tokens = 32000

[execution]
llm_attempts = 5
identical_tool_call_limit = 16
context_safety_tokens = 4096

[tools]
max_result_bytes = 1048576
max_in_flight = 64

[tools.search]
enabled = true
max_matches = 1000
max_context_lines = 100

[tools.read]
enabled = true

[cache]
enabled = true
max_bytes = 1073741824
