# ATT 随包提供的 Formic 高吞吐默认配置。
# 首次安装会复制为 config.toml；后续更新只刷新本文件，不覆盖已经填写的 config.toml。
# 模型协议仍由 FORMIC_LLM_PROTOCOL 选择；API key 建议使用 FORMIC_LLM_API_KEY 提供。

url = "https://api.example.com/v1"
api_key = ""
model = "model-name"
context_window_tokens = 131072
max_output_tokens = 16384

[execution]
llm_attempts = 5
identical_tool_call_limit = 16
context_safety_tokens = 2048

[tools]
max_result_bytes = 1048576
max_in_flight = 64

[tools.search]
enabled = true
max_matches = 1000
max_context_lines = 100

[tools.read]
enabled = true

[cache]
enabled = true
max_bytes = 1073741824
